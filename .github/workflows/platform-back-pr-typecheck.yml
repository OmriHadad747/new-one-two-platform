name: platform-back — PR check

on:
  pull_request:
    paths:
      - "platform-back/**"
      - ".github/workflows/platform-back-*.yml"

jobs:
  typecheck:
    name: Build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-back

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: platform-back/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck
