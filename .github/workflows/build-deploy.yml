# ─── Build & Deploy Pipeline ────────────────────────────────────────────────────
# Builds Docker images, pushes to Artifact Registry, deploys to Cloud Run.
#
# Triggers:
#   - Push to main → deploy to production
#   - Push to staging → deploy to staging
#   - Manual dispatch for any branch
#
# ── GitHub Secrets ────────────────────────────────────────────────────────────
#   GCP_SA_KEY              — Service account key JSON (CI auth)
#   DB_PASSWORD             — Postgres password (for CI migrations only)
#   DB_USER                 — Postgres user (for CI migrations only)
#   DB_NAME                 — Postgres DB name (for CI migrations only)
#
#   Runtime secrets live in GCP Secret Manager, referenced from deploy/*.yaml.
#
# ── GitHub Variables ──────────────────────────────────────────────────────────
#   GCP_REGION              — e.g. us-central1
#   GCP_PROJECT_ID          — e.g. newonetwo-493019
#   DOCKER_REGISTRY         — e.g. us-central1-docker.pkg.dev/PROJECT/REPO
#   CLOUD_SQL_CONNECTION    — Cloud SQL instance connection name
#   API_URL                 — Public API URL (for frontend build)
#   FRONTEND_BUCKET         — GCS bucket for frontend assets

name: Build & Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Determine environment ──────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ─── Pre-deploy gate: build + tests must pass ───────────────────────────────
  # Mirrors the ci.yml job for PR validation, but runs inline here so a push
  # direct to main/staging (bypassing the PR gate) still has to pass tests
  # before any Docker image is built or any Cloud Run service is touched.
  #
  # `build` depends on this job; `migrate` and `deploy` depend transitively
  # via `build`. A test failure short-circuits the entire deploy chain.
  #
  # Deliberate duplication with ci.yml rather than a reusable workflow: two
  # call sites today, both short, trivially readable. If a third one shows
  # up we extract.
  test:
    runs-on: ubuntu-latest
    needs: setup
    # No `environment:` key on purpose — testcontainers runs the whole test
    # suite on the runner itself, doesn't touch GCP / Cloud SQL / Secret
    # Manager, and therefore doesn't need environment-scoped secrets like
    # GCP_SA_KEY or DB_PASSWORD. If you add a step here that does need a
    # secret (e.g. a smoke test against staging), also add `environment: …`
    # or the step silently won't see the secret and will fail with a
    # confusing auth error.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        working-directory: platform
        run: pnpm -r build

      - name: Verify Docker is available for testcontainers
        run: docker version

      - name: Run tests (vitest — all suites, including RLS integration)
        working-directory: platform
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: pnpm --filter @new-one-two/api --filter @new-one-two/deployer test

  # ─── Build & Push Docker Images ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [setup, test]
    environment: ${{ needs.setup.outputs.environment }}
    env:
      GCP_REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.DOCKER_REGISTRY }}
    strategy:
      matrix:
        service:
          - name: api
            context: ./platform
            dockerfile: apps/api/Dockerfile
          - name: webhook-gateway
            context: ./platform
            dockerfile: apps/webhook-gateway/Dockerfile
          - name: worker
            context: ./platform
            dockerfile: apps/worker/Dockerfile
          - name: generator
            context: ./generator
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ needs.setup.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Run Database Migrations ────────────────────────────────────────────────
  migrate:
    runs-on: ubuntu-latest
    needs: [setup, build]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SQL Proxy
        run: |
          curl -sL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64 \
            -o /usr/local/bin/cloud-sql-proxy
          chmod +x /usr/local/bin/cloud-sql-proxy

      - name: Run migrations
        run: |
          # Start Cloud SQL Proxy in background
          # Requires public IP on the Cloud SQL instance (already enabled).
          cloud-sql-proxy ${{ vars.CLOUD_SQL_CONNECTION }} --port 5432 &
          PROXY_PID=$!
          # Wait up to 15 seconds for the proxy to be ready
          for i in $(seq 1 15); do
            if nc -z 127.0.0.1 5432 2>/dev/null; then break; fi
            echo "Waiting for proxy... ($i/15)"
            sleep 1
          done
          nc -z 127.0.0.1 5432 || { echo "Cloud SQL Proxy failed to start"; kill $PROXY_PID 2>/dev/null; exit 1; }

          export PGPASSWORD="${{ secrets.DB_PASSWORD }}"
          PSQL_ARGS=(-h 127.0.0.1 -p 5432 -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}")

          # Create migration tracking table (idempotent)
          psql "${PSQL_ARGS[@]}" -c "
            CREATE TABLE IF NOT EXISTS _schema_migrations (
              filename TEXT PRIMARY KEY,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );
          "

          # Bootstrap: if the tracking table is empty but the schema already
          # exists (e.g. DB was initialized manually), mark existing migrations
          # as applied so we don't re-run them and fail on duplicate objects.
          TRACKING_EMPTY=$(psql "${PSQL_ARGS[@]}" -tAc "SELECT COUNT(*) FROM _schema_migrations")
          if [ "$TRACKING_EMPTY" = "0" ]; then
            SCHEMA_EXISTS=$(psql "${PSQL_ARGS[@]}" -tAc "SELECT 1 FROM pg_type WHERE typname='tenant_status'")
            if [ "$SCHEMA_EXISTS" = "1" ]; then
              echo "Schema already exists but tracking table is empty — recording existing migrations as applied."
              for migration in platform/packages/db/migrations/*.sql; do
                filename=$(basename "$migration")
                psql "${PSQL_ARGS[@]}" -c "INSERT INTO _schema_migrations (filename) VALUES ('${filename}') ON CONFLICT DO NOTHING"
              done
            fi
          fi

          # Run only NEW migration files in order
          for migration in platform/packages/db/migrations/*.sql; do
            filename=$(basename "$migration")
            already=$(psql "${PSQL_ARGS[@]}" -tAc "SELECT 1 FROM _schema_migrations WHERE filename = '${filename}'")
            if [ "$already" = "1" ]; then
              echo "Skipping already-applied: $filename"
              continue
            fi
            echo "Running migration: $filename"
            psql "${PSQL_ARGS[@]}" -f "$migration" -v ON_ERROR_STOP=1
            psql "${PSQL_ARGS[@]}" -c "INSERT INTO _schema_migrations (filename) VALUES ('${filename}')"
          done
        env:
          PGCONNECT_TIMEOUT: 10

  # ─── Deploy to Cloud Run ────────────────────────────────────────────────────
  # Each service has a declarative YAML spec in deploy/<service>.yaml.
  # Env vars, secrets, scaling, and resource limits are all defined there.
  # The only thing CI does is stamp the image tag and run `gcloud run services replace`.
  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build, migrate]
    environment: ${{ needs.setup.outputs.environment }}
    strategy:
      matrix:
        service: [api, webhook-gateway, worker, generator]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Stamp image tag into service YAML
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ vars.DOCKER_REGISTRY }}/${{ matrix.service }}:${{ needs.setup.outputs.image_tag }}|" \
            deploy/${{ matrix.service }}.yaml

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace deploy/${{ matrix.service }}.yaml \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: Set IAM policy (public services)
        if: matrix.service == 'api' || matrix.service == 'webhook-gateway'
        run: |
          gcloud run services add-iam-policy-binding ${{ matrix.service }} \
            --region=${{ vars.GCP_REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --project=${{ vars.GCP_PROJECT_ID }}

  # ─── Build & Deploy Frontend ────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-front/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: platform-front
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: platform-front
        run: pnpm build
        env:
          VITE_API_URL: ${{ vars.API_URL }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy frontend to GCS
        run: |
          gcloud storage rsync -r --delete-unmatched-destination-objects \
            platform-front/dist gs://${{ vars.FRONTEND_BUCKET }}/
          gcloud storage objects update \
            "gs://${{ vars.FRONTEND_BUCKET }}/assets/**" \
            --cache-control="public, max-age=3600"
          gcloud storage objects update \
            "gs://${{ vars.FRONTEND_BUCKET }}/index.html" \
            --cache-control="no-cache"
