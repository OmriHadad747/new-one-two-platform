# ─── Build & Deploy Pipeline ────────────────────────────────────────────────────
# Builds Docker images, pushes to Artifact Registry, deploys to Cloud Run.
#
# Triggers:
#   - Push to main → deploy to production
#   - Push to staging → deploy to staging
#   - Manual dispatch for any branch
#
# Required GitHub Secrets:
#   GCP_PROJECT_ID          — GCP project ID
#   GCP_REGION              — e.g. us-central1
#   GCP_SA_KEY              — Service account key JSON (or use Workload Identity Federation)
#   DOCKER_REGISTRY         — e.g. us-central1-docker.pkg.dev/PROJECT/REPO
#
# Required GitHub Variables (non-secret):
#   CLOUD_SQL_CONNECTION    — Cloud SQL instance connection name (for migrations)

name: Build & Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Determine environment ──────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ─── Build & Push Docker Images ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    env:
      GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
      REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
    strategy:
      matrix:
        service:
          - name: api
            context: ./platform
            dockerfile: apps/api/Dockerfile
          - name: webhook-gateway
            context: ./platform
            dockerfile: apps/webhook-gateway/Dockerfile
          - name: worker
            context: ./platform
            dockerfile: apps/worker/Dockerfile
          - name: generator
            context: ./generator
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ needs.setup.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Run Database Migrations ────────────────────────────────────────────────
  migrate:
    runs-on: ubuntu-latest
    needs: [setup, build]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SQL Proxy
        run: |
          curl -sL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64 \
            -o /usr/local/bin/cloud-sql-proxy
          chmod +x /usr/local/bin/cloud-sql-proxy

      - name: Run migrations
        run: |
          # Start Cloud SQL Proxy in background
          cloud-sql-proxy ${{ vars.CLOUD_SQL_CONNECTION }} --port 5432 &
          sleep 3

          export PGPASSWORD="${{ secrets.DB_PASSWORD }}"
          PSQL_ARGS=(-h 127.0.0.1 -p 5432 -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}")

          # Create migration tracking table (idempotent)
          psql "${PSQL_ARGS[@]}" -c "
            CREATE TABLE IF NOT EXISTS _schema_migrations (
              filename TEXT PRIMARY KEY,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );
          "

          # Run only NEW migration files in order
          for migration in platform/packages/db/migrations/*.sql; do
            filename=$(basename "$migration")
            already=$(psql "${PSQL_ARGS[@]}" -tAc "SELECT 1 FROM _schema_migrations WHERE filename = '${filename}'")
            if [ "$already" = "1" ]; then
              echo "Skipping already-applied: $filename"
              continue
            fi
            echo "Running migration: $filename"
            psql "${PSQL_ARGS[@]}" -f "$migration" -v ON_ERROR_STOP=1
            psql "${PSQL_ARGS[@]}" -c "INSERT INTO _schema_migrations (filename) VALUES ('${filename}')"
          done
        env:
          PGCONNECT_TIMEOUT: 10

  # ─── Deploy to Cloud Run ────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build, migrate]
    environment: ${{ needs.setup.outputs.environment }}
    env:
      GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
      REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
    strategy:
      matrix:
        service:
          - name: api
            port: 3002
            allow_unauthenticated: true
            min_instances: 1
            memory: 512Mi
            cpu: "1"
          - name: webhook-gateway
            port: 3001
            allow_unauthenticated: true
            min_instances: 1
            memory: 256Mi
            cpu: "1"
          - name: worker
            port: 8080
            allow_unauthenticated: false
            min_instances: 1
            memory: 512Mi
            cpu: "1"
          - name: generator
            port: 8001
            allow_unauthenticated: false
            min_instances: 1
            memory: 1Gi
            cpu: "2"
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.service.name }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ needs.setup.outputs.image_tag }}
          flags: >-
            --port=${{ matrix.service.port }}
            --memory=${{ matrix.service.memory }}
            --cpu=${{ matrix.service.cpu }}
            --min-instances=${{ matrix.service.min_instances }}
            --max-instances=10
            --timeout=300
            --vpc-connector=${{ secrets.VPC_CONNECTOR }}
            ${{ matrix.service.allow_unauthenticated && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}

  # ─── Build & Deploy Frontend ────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-front/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: platform-front
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: platform-front
        run: pnpm build
        env:
          VITE_API_URL: ${{ secrets.API_URL }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy frontend to GCS
        run: |
          gsutil -m rsync -r -d platform-front/dist gs://${{ secrets.FRONTEND_BUCKET }}/
          gsutil -m setmeta -h "Cache-Control:public, max-age=3600" \
            "gs://${{ secrets.FRONTEND_BUCKET }}/assets/**"
          gsutil -m setmeta -h "Cache-Control:no-cache" \
            "gs://${{ secrets.FRONTEND_BUCKET }}/index.html"
