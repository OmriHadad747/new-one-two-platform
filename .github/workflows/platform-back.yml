name: platform-back

on:
  pull_request:
    paths:
      - "platform-back/**"
      - ".github/workflows/platform-back.yml"

concurrency:
  group: platform-back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-back

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: platform-back/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

  unit:
    name: Unit & route-integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-back

    env:
      NODE_ENV: test
      SHOPIFY_CLIENT_ID: ci-client-id
      SHOPIFY_CLIENT_SECRET: ci-client-secret
      JWT_SECRET: ci-jwt-secret
      PLATFORM_URL: http://localhost:3002
      DASHBOARD_URL: http://localhost:3000
      WEBHOOK_GATEWAY_URL: http://localhost:3003
      GCP_PROJECT: local
      DEPLOY_MODE: local
      API_AUTH_REQUIRED: "false"
      CLOUD_RUN_SKIP_AUTH: "true"
      EXPECTED_AUDIENCE: http://localhost:3002
      PLATFORM_SA_EMAIL: ""
      DATABASE_URL: postgresql://unused:unused@localhost/unused

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: platform-back/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (so type imports resolve)
        run: pnpm -r build

      - name: Run tests
        run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker (required for testcontainers)
        run: docker version

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: platform-back/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: platform-back
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: platform-back
        run: pnpm build

      - name: Run integration tests
        working-directory: platform-back
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          RUN_PG_CRON_SMOKE: "true"
        run: pnpm exec vitest run --project integration
