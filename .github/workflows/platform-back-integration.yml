# ─── platform-back integration tests ──────────────────────────────────────────
#
# Runs on PRs to main, or when the `run-integration` label is applied.
# Heavier than unit: boots a real Postgres (via testcontainers inside the
# test code) with pg_cron enabled, a mock Resend server, and a stub Cloud
# Run client.
#
# pg_cron note: the test code must start postgres with a pg_cron-enabled
# image (e.g. `postgres:16` + pg_cron installed, or a custom image) and
# pass `-c shared_preload_libraries=pg_cron` as the server command.
# testcontainers handles this — no service: block needed here.
#
# This job is gated behind `run-integration` label so it doesn't burn
# runner minutes on every draft PR. Remove the label condition once the
# suite is stable enough to run unconditionally.

name: platform-back integration

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]
    paths:
      - "platform-back/**"
      - ".github/workflows/platform-back-integration.yml"

concurrency:
  group: platform-back-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration tests
    # Only run when the `run-integration` label is present, or when pushing
    # directly to main (bypassing PR label gate).
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker (required for testcontainers)
        run: docker version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-back/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: platform-back
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: platform-back
        run: pnpm build

      - name: Run integration tests
        working-directory: platform-back
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # Gate pg_cron smoke test behind an env flag — it waits a full
          # cron cycle and should only run explicitly.
          RUN_PG_CRON_SMOKE: "true"
        run: pnpm exec vitest run --project integration
