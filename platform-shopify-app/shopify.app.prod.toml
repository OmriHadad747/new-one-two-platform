name      = "new-one-two"
client_id = "a2f831d9652fdb7ef86829111ac4a70e"

# Shopify Admin sidebar loads this URL in the embedded iframe.
application_url = "https://admin.newonetwo.com"
embedded        = true

[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_customers,read_inventory,read_themes,write_themes,unauthenticated_read_product_listings,unauthenticated_read_product_inventory,unauthenticated_read_collection_listings,unauthenticated_read_checkouts,unauthenticated_write_checkouts,unauthenticated_read_customers,unauthenticated_write_customers"

[auth]
redirect_urls = [
  "https://api.newonetwo.com/oauth/callback",
]

[app_proxy]
url     = "https://api.newonetwo.com/widget"
subpath = "apps"
prefix  = "new-one-two"

[webhooks]
api_version = "2026-01"

[[extensions]]
path = "extensions/widget-runtime"

[pos]
embedded = false
