# Phase 1 target operations for the Shopify Admin example bank.
#
# Every entry has been validated against
# platform-ai/catalogs/shopify_admin/2026-04/schema.graphql.
#
# `name`     : exact field name as it appears in the schema (canonical).
# `kind`     : "query" | "mutation".
# `family`   : grouping used for JIT-loaded family-quirk slices.
# `note`     : short reminder of the app-level use case.
# `original` : the name from the user's source list, ONLY when it differs
#              from the canonical schema name (so we keep traceability).
# `status`   : "ok" (in schema) | "needs_clarification" (ambiguous in source list).
#
# Total: 96 operations. Naming corrections applied below; see CHANGES section
# at bottom for the audit trail.

operations:

  # ---------- Products & Variants ----------
  - { name: products,                   kind: query,    family: products,  note: "Bulk fetch the store catalog",                  status: ok }
  - { name: product,                    kind: query,    family: products,  note: "Fetch a single product",                         status: ok }
  - { name: productCreate,              kind: mutation, family: products,  note: "Create a product",                               status: ok }
  - { name: productUpdate,              kind: mutation, family: products,  note: "Update tags, vendor data, descriptions",         status: ok }
  - { name: productDelete,              kind: mutation, family: products,  note: "Delete a product (catalog cleanup)",             status: ok }
  - { name: productVariants,            kind: query,    family: variants,  note: "Fetch variants (size/color)",                    status: ok }
  - { name: productVariant,             kind: query,    family: variants,  note: "Fetch a specific variant",                       status: ok }
  - { name: productVariantsBulkCreate,  kind: mutation, family: variants,  note: "Add variants (modern bulk endpoint)",            status: ok, original: productVariantCreate }
  - { name: productVariantsBulkUpdate,  kind: mutation, family: variants,  note: "Update variant prices/weights (bulk endpoint)",  status: ok, original: productVariantUpdate }
  - { name: productVariantsBulkDelete,  kind: mutation, family: variants,  note: "Remove deprecated variants (bulk endpoint)",     status: ok, original: productVariantDelete }

  # ---------- Inventory ----------
  - { name: inventoryItems,                kind: query,    family: inventory, note: "SKU + tracked status baseline",                status: ok }
  - { name: inventoryItemUpdate,           kind: mutation, family: inventory, note: "Modify tracking + unit cost",                  status: ok }
  - { name: inventoryLevels,               kind: query,    family: inventory, note: "Real-time stock per location",                 status: ok }
  - { name: inventoryAdjustQuantities,     kind: mutation, family: inventory, note: "Increment/decrement stock",                    status: ok }
  - { name: inventorySetOnHandQuantities,  kind: mutation, family: inventory, note: "Force exact stock overwrite",                  status: ok }

  # ---------- Media & Files ----------
  - { name: files,                kind: query,    family: media, note: "Bulk scan store files (e.g. heavy images)", status: ok }
  - { name: stagedUploadsCreate,  kind: mutation, family: media, note: "Generate signed upload URLs",                status: ok }
  - { name: fileCreate,           kind: mutation, family: media, note: "Register an uploaded file",                  status: ok }
  - { name: fileUpdate,           kind: mutation, family: media, note: "Update alt text / metadata (SEO)",            status: ok }
  - { name: productCreateMedia,   kind: mutation, family: media, note: "Attach media to a product",                  status: ok }
  - { name: productUpdateMedia,   kind: mutation, family: media, note: "Swap product media",                          status: ok }
  - { name: productDeleteMedia,   kind: mutation, family: media, note: "Remove product media",                        status: ok }

  # ---------- Webhooks ----------
  - { name: webhookSubscriptions,                  kind: query,    family: webhooks, note: "List active subscriptions",            status: ok }
  - { name: webhookSubscriptionCreate,             kind: mutation, family: webhooks, note: "Subscribe to events",                  status: ok }
  - { name: webhookSubscriptionUpdate,             kind: mutation, family: webhooks, note: "Change callback URL",                  status: ok }
  - { name: webhookSubscriptionDelete,             kind: mutation, family: webhooks, note: "Unsubscribe",                          status: ok }
  - { name: eventBridgeWebhookSubscriptionCreate,  kind: mutation, family: webhooks, note: "Route webhooks to AWS EventBridge",    status: ok }
  - { name: pubSubWebhookSubscriptionCreate,       kind: mutation, family: webhooks, note: "Route webhooks to Google Cloud Pub/Sub", status: ok }

  # ---------- Metafields ----------
  - { name: metafields,                  kind: query,    family: metafields, note: "Read app config / hidden data",      status: ok }
  - { name: metafieldsSet,               kind: mutation, family: metafields, note: "Upsert app data on a resource",      status: ok }
  - { name: metafieldsDelete,            kind: mutation, family: metafields, note: "Delete metafields",                  status: ok, original: metafieldDelete }
  - { name: metafieldDefinitions,        kind: query,    family: metafields, note: "Inspect structured-data schemas",    status: ok }
  - { name: metafieldDefinitionCreate,   kind: mutation, family: metafields, note: "Create a metafield definition",      status: ok }
  - { name: metafieldDefinitionUpdate,   kind: mutation, family: metafields, note: "Update a metafield definition",      status: ok }

  # ---------- Customers ----------
  - { name: customers,                              kind: query,    family: customers, note: "List customers",                       status: ok }
  - { name: customer,                               kind: query,    family: customers, note: "Fetch a specific customer",            status: ok }
  - { name: customerUpdate,                         kind: mutation, family: customers, note: "Tag / update customer",                status: ok }
  - { name: customerEmailMarketingConsentUpdate,    kind: mutation, family: customers, note: "Update marketing opt-in",              status: ok }

  # ---------- Store Context & App State ----------
  - { name: shop,                    kind: query, family: store_context, note: "Timezone, domain, currency (no-arg query)",      status: ok }
  - { name: locations,               kind: query, family: store_context, note: "Warehouse IDs (required for inventory ops)",     status: ok }
  - { name: currentAppInstallation,  kind: query, family: store_context, note: "Current app's granted scopes (no-arg query)",    status: ok }
  - { name: appInstallation,         kind: query, family: store_context, note: "Inspect a specific installation",                status: ok }

  # ---------- Orders & Fulfillments ----------
  - { name: orders,             kind: query,    family: orders,       note: "Historical sales",                                    status: ok }
  - { name: order,              kind: query,    family: orders,       note: "Fetch a specific order",                              status: ok }
  - { name: orderUpdate,        kind: mutation, family: orders,       note: "Append fraud tags / notes",                           status: ok }
  - { name: fulfillmentOrders,  kind: query,    family: fulfillment,  note: "Modern fulfillment state",                            status: ok }
  - { name: fulfillmentCreate,  kind: mutation, family: fulfillment,  note: "Mark items shipped + tracking (current API)",         status: ok, original: fulfillmentCreateV2 }
  - { name: draftOrders,        kind: query,    family: orders,       note: "Pending invoices / B2B",                              status: ok }
  - { name: draftOrderCreate,   kind: mutation, family: orders,       note: "Custom checkouts / bundles",                          status: ok }
  - { name: discountCodeBasicCreate, kind: mutation, family: discounts, note: "Single-use loyalty / reward codes",                 status: ok }

  # ---------- Collections ----------
  - { name: collections,       kind: query,    family: collections, note: "List smart/manual collections",     status: ok }
  - { name: collection,        kind: query,    family: collections, note: "Fetch a specific collection",       status: ok }
  - { name: collectionCreate,  kind: mutation, family: collections, note: "Build a new collection",            status: ok }
  - { name: collectionUpdate,  kind: mutation, family: collections, note: "Modify collection rules/SEO",       status: ok }
  - { name: collectionDelete,  kind: mutation, family: collections, note: "Remove a collection",               status: ok }

  # ---------- Discounts & Promotions ----------
  - { name: discountNodes,                kind: query,    family: discounts, note: "List active discounts",                                status: ok }
  - { name: discountNode,                 kind: query,    family: discounts, note: "Inspect a specific discount",                          status: ok }
  - { name: discountAutomaticAppCreate,   kind: mutation, family: discounts, note: "Function-backed automatic discount",                   status: ok }
  - { name: discountAutomaticAppUpdate,   kind: mutation, family: discounts, note: "Modify a function-backed automatic discount",          status: ok }
  - { name: discountCodeAppCreate,        kind: mutation, family: discounts, note: "Function-backed code discount",                        status: ok }
  - { name: discountCodeAppUpdate,        kind: mutation, family: discounts, note: "Modify a function-backed code discount",               status: ok }
  - { name: discountAutomaticDelete,      kind: mutation, family: discounts, note: "Delete an automatic discount",                         status: ok, original: discountNodeDelete }
  - { name: discountCodeDelete,           kind: mutation, family: discounts, note: "Delete a code discount",                               status: ok, original: discountNodeDelete }

  # ---------- Bulk Operations ----------
  - { name: bulkOperationRunQuery,    kind: mutation, family: bulk, note: "Async download of large datasets (JSONL)", status: ok }
  - { name: bulkOperationRunMutation, kind: mutation, family: bulk, note: "Async bulk update",                          status: ok }
  - { name: currentBulkOperation,     kind: query,    family: bulk, note: "Status/progress of running bulk job",        status: ok }
  - { name: bulkOperationCancel,      kind: mutation, family: bulk, note: "Cancel a running bulk job",                  status: ok }

  # ---------- Selling Plans (Subscriptions / Pre-orders) ----------
  - { name: sellingPlanGroups,             kind: query,    family: selling_plans, note: "List subscription / pre-order tiers", status: ok }
  - { name: sellingPlanGroupCreate,        kind: mutation, family: selling_plans, note: "Create a new tier",                    status: ok }
  - { name: sellingPlanGroupUpdate,        kind: mutation, family: selling_plans, note: "Update delivery / billing policies",   status: ok }
  - { name: sellingPlanGroupDelete,        kind: mutation, family: selling_plans, note: "Delete a tier",                        status: ok }
  - { name: productJoinSellingPlanGroups,  kind: mutation, family: selling_plans, note: "Attach products to a tier",            status: ok }
  - { name: productLeaveSellingPlanGroups, kind: mutation, family: selling_plans, note: "Detach products from a tier",          status: ok }

  # ---------- Translations & Locales ----------
  - { name: shopLocales,           kind: query,    family: i18n, note: "Supported locales",                  status: ok }
  - { name: translatableResources, kind: query,    family: i18n, note: "Content needing translation",        status: ok }
  - { name: translationsRegister,  kind: mutation, family: i18n, note: "Inject translated text",             status: ok }
  - { name: translationsRemove,    kind: mutation, family: i18n, note: "Remove outdated translations",       status: ok }

  # ---------- Themes & Storefront ----------
  - { name: themes,             kind: query,    family: themes, note: "List installed themes",            status: ok }
  - { name: theme,              kind: query,    family: themes, note: "Fetch a specific theme (theme.files used to read assets)", status: ok, original: themeFiles }
  - { name: themeFilesUpsert,   kind: mutation, family: themes, note: "Inject app assets / Liquid",       status: ok }
  - { name: themeFilesDelete,   kind: mutation, family: themes, note: "Remove app assets",                status: ok }

  # ---------- Pages & Blogs ----------
  - { name: pages,         kind: query,    family: content, note: "Static pages (About, Contact, FAQ)",   status: ok }
  - { name: pageCreate,    kind: mutation, family: content, note: "Auto-generate landing pages",           status: ok }
  - { name: pageUpdate,    kind: mutation, family: content, note: "Update page HTML / SEO metadata",       status: ok }
  - { name: pageDelete,    kind: mutation, family: content, note: "Remove a page",                         status: ok }
  - { name: blogs,         kind: query,    family: content, note: "Blog categories",                       status: ok }
  - { name: articles,      kind: query,    family: content, note: "Individual blog posts",                 status: ok }
  - { name: articleCreate, kind: mutation, family: content, note: "Publish blog content",                  status: ok }
  - { name: articleUpdate, kind: mutation, family: content, note: "Update tags, authors, SEO",             status: ok }

  # ---------- Customer Segments ----------
  - { name: segments,       kind: query,    family: segments, note: "Dynamic customer groups",             status: ok }
  - { name: segmentCreate,  kind: mutation, family: segments, note: "Create a rule-based group",            status: ok }
  - { name: segmentUpdate,  kind: mutation, family: segments, note: "Modify segment logic",                 status: ok }
  - { name: segmentDelete,  kind: mutation, family: segments, note: "Remove a segment",                     status: ok }

  # ---------- Fulfillment Services (3PL) ----------
  - { name: fulfillmentService,        kind: query,    family: fulfillment_services, note: "Fetch a 3PL provider (singular only in schema)", status: ok, original: fulfillmentServices }
  - { name: fulfillmentServiceCreate,  kind: mutation, family: fulfillment_services, note: "Register app as 3PL",                              status: ok }
  - { name: fulfillmentServiceUpdate,  kind: mutation, family: fulfillment_services, note: "Update callbacks / tracking caps",                 status: ok }


# -----------------------------------------------------------------
# CHANGES vs the source list (audit trail — keep in sync if list changes):
# -----------------------------------------------------------------
# productVariantCreate   -> productVariantsBulkCreate    (single-variant API was removed; bulk is canonical)
# productVariantUpdate   -> productVariantsBulkUpdate    (same)
# productVariantDelete   -> productVariantsBulkDelete    (same)
# metafieldDelete        -> metafieldsDelete             (plural is the schema name)
# fulfillmentCreateV2    -> fulfillmentCreate            (V2 deprecated; current name has no V2 suffix)
# discountNodeDelete     -> discountAutomaticDelete + discountCodeDelete  (no unified delete; split by discount type)
# themeFiles             -> theme  (no top-level themeFiles query; read files via theme.files)
# fulfillmentServices    -> fulfillmentService           (only singular query exists; list via shop.fulfillmentServices)
#
# Total: 96 entries (after the discountNodeDelete split into 2).
